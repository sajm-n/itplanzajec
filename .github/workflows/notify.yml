name: Powiadomienia o zadaniach

# Pętla działająca ~6 godzin: co minutę sprawdza zadania z plan.json i wysyła powiadomienia push na zapisane urządzenia,
# także gdy aplikacja jest zamknięta. Co godzinę GitHub zgłasza kolejny przebieg; czeka on w kolejce i startuje, gdy poprzedni się skończy
# (stąd w zakładce Actions widać też „anulowane" przebiegi: to normalne, w kolejce mieści się tylko jeden).
# Wymaga sekretu VAPID_PRIVATE_KEY (Settings → Secrets and variables → Actions).
on:
  schedule:
    - cron: "5 * * * *"
  workflow_dispatch:
    inputs:
      test:
        description: "Wyślij testowe powiadomienie na wszystkie zapisane urządzenia (bez pętli)"
        type: boolean
        default: false

permissions:
  contents: write

concurrency:
  group: powiadomienia
  cancel-in-progress: false

jobs:
  send:
    runs-on: ubuntu-latest
    timeout-minutes: 358
    env:
      TZ: Europe/Warsaw
      BRANCH: ${{ github.ref_name }}
      VAPID_PRIVATE_KEY: ${{ secrets.VAPID_PRIVATE_KEY }}
    steps:
      - uses: actions/checkout@v4
      - name: Powiadomienia
        env:
          TEST: ${{ inputs.test }}
        run: |
          if [ "${TEST:-false}" = "true" ]; then
            node scripts/notify.mjs || true
          else
            bash scripts/loop.sh
          fi
