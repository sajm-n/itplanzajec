name: Powiadomienia o zadaniach

# Co 5 minut sprawdza zadania z plan.json i wysyła powiadomienia push na zapisane urządzenia,
# także gdy aplikacja jest zamknięta. Wymaga sekretu VAPID_PRIVATE_KEY (Settings → Secrets and variables → Actions).
on:
  schedule:
    - cron: "*/5 * * * *"
  workflow_dispatch:
    inputs:
      test:
        description: "Wyślij testowe powiadomienie na wszystkie zapisane urządzenia"
        type: boolean
        default: false

permissions:
  contents: write

concurrency:
  group: powiadomienia
  cancel-in-progress: false

jobs:
  send:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      TZ: Europe/Warsaw
    steps:
      - uses: actions/checkout@v4
      - name: Wyślij powiadomienia
        env:
          VAPID_PRIVATE_KEY: ${{ secrets.VAPID_PRIVATE_KEY }}
          TEST: ${{ inputs.test }}
        run: node scripts/notify.mjs
      - name: Zapisz stan wysyłki
        if: always()
        run: |
          if [ -n "$(git status --porcelain push-state.json push-subscriptions.json)" ]; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add push-state.json push-subscriptions.json
            git commit -m "Powiadomienia: stan wysyłki"
            git pull --rebase origin "${{ github.ref_name }}"
            git push
          fi
