<style>
:root{--bg:#eef1f6;--card:#fff;--tx:#17202e;--mut:#5d6878;--bd:#d9dfe9;--ac:#1f3a8a;--acx:#fff;
--wyk:#b4c7e7;--lab:#ffed9f;--cw:#a9d18e;--tint:#17202e;
box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#10151f;--card:#19212f;--tx:#eaeef6;--mut:#9aa6ba;--bd:#2a3446;--ac:#9db4f5;--acx:#10151f;--wyk:#3a5486;--lab:#7d6a12;--cw:#3f7440;--tint:#eaeef6}}
:root[data-theme="dark"]{--bg:#10151f;--card:#19212f;--tx:#eaeef6;--mut:#9aa6ba;--bd:#2a3446;--ac:#9db4f5;--acx:#10151f;--wyk:#3a5486;--lab:#7d6a12;--cw:#3f7440;--tint:#eaeef6}
html{scroll-padding-top:env(safe-area-inset-top,0px);height:auto}
body{margin:0;background:var(--bg);color:var(--tx);font-family:"Bricolage Grotesque",system-ui,-apple-system,"Segoe UI",sans-serif;line-height:1.35}
main{max-width:560px;margin:0 auto;padding:18px 14px 28px}
h1{font-size:30px;font-weight:800;letter-spacing:-.02em;margin:0}
.sub{color:var(--mut);font-size:14px;margin:2px 0 14px;text-transform:capitalize}
.row{display:flex;gap:8px;align-items:center;justify-content:space-between;margin-bottom:12px}
.seg{display:flex;background:var(--card);border:1px solid var(--bd);border-radius:10px;padding:3px;gap:2px}
button{font:inherit;color:inherit;border:0;background:none;cursor:pointer}
.seg button{padding:7px 14px;border-radius:8px;font-weight:600;font-size:14px;color:var(--mut)}
.seg button.on{background:var(--ac);color:var(--acx)}
button:focus-visible{outline:2px solid var(--ac);outline-offset:2px}
.days{display:grid;grid-template-columns:repeat(5,1fr);gap:6px;margin-bottom:14px}
.days button{padding:10px 0;border:1px solid var(--bd);background:var(--card);border-radius:10px;font-weight:600;font-size:15px}
.days button.on{background:var(--ac);color:var(--acx);border-color:var(--ac)}
.days button.td:not(.on){border-color:var(--ac);color:var(--ac)}
.today{font-size:13px;font-weight:600;color:var(--ac);padding:7px 4px}
.c{display:flex;background:var(--card);border:1px solid var(--bd);border-radius:12px;overflow:hidden;margin-bottom:8px}
.c.past{opacity:.5}
.c.now{border-color:var(--ac);box-shadow:0 0 0 2px var(--ac)}
.tm{flex:0 0 78px;padding:12px 6px;text-align:center;display:flex;flex-direction:column;justify-content:center;color:#17202e}
.tm b{font-size:22px;font-weight:800;letter-spacing:-.02em;line-height:1}
.tm span{font-size:13px;margin-top:4px;opacity:.75}
.w .tm{background:var(--wyk)}.l .tm{background:var(--lab)}.c2 .tm{background:var(--cw)}.x .tm{background:#cfd4dc}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]) .x .tm{background:#4b5363}}
:root[data-theme="dark"] .x .tm{background:#4b5363}
:root[data-theme="dark"] .tm,:root:not([data-theme="light"]) .tm{--x:0}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]) .tm{color:#f3f5fa}}
:root[data-theme="dark"] .tm{color:#f3f5fa}
.bd{padding:11px 12px;min-width:0;flex:1}
.nm{font-weight:600;font-size:16px;line-height:1.25}
.mt{display:flex;flex-wrap:wrap;gap:4px 10px;margin-top:5px;font-size:13px;color:var(--mut)}
.ty{font-weight:600;color:var(--tx)}
.ev{border:1px solid var(--bd);border-radius:6px;padding:0 6px;font-size:12px}
.st{align-self:flex-start;margin:10px 10px 0 0;font-size:12px;font-weight:600;padding:2px 8px;border-radius:99px;background:var(--ac);color:var(--acx);white-space:nowrap}
.st.nx{background:none;color:var(--ac);border:1px solid var(--ac)}
h2{font-size:17px;font-weight:800;margin:20px 0 8px}
.free{padding:26px 14px;text-align:center;color:var(--mut);border:1px dashed var(--bd);border-radius:12px}
.leg{display:flex;gap:14px;flex-wrap:wrap;margin-top:22px;font-size:13px;color:var(--mut)}
.leg i{display:inline-block;width:12px;height:12px;border-radius:3px;margin-right:5px;vertical-align:-1px}
#sub{text-transform:none}#sub::first-letter{text-transform:uppercase}
.cal{background:var(--card);border:1px solid var(--bd);border-radius:14px;padding:10px 8px 8px;margin-bottom:14px;box-sizing:border-box;touch-action:pan-y;-webkit-user-select:none;user-select:none}
.ch{display:flex;align-items:center;justify-content:space-between;margin-bottom:6px}
.ch b{font-size:16px;font-weight:800;text-transform:capitalize}
.ch button{width:36px;height:36px;border-radius:10px;font-size:20px;color:var(--mut)}
.cx{display:block;margin:4px auto 0;width:44px;height:20px;color:var(--mut);font-size:15px;line-height:1}
.cg{display:grid;grid-template-columns:22px repeat(7,1fr);gap:2px 0;text-align:center}
.cg .hd{font-size:12px;color:var(--mut);padding:2px 0 4px}
.cg .wl{font-size:11px;font-weight:800;color:var(--ac);align-self:center}
.cg button{height:38px;border-radius:10px;font-size:15px;font-weight:600;position:relative}
.cg button.out{opacity:.4}
.cg button.we{color:var(--mut)}
.cg button.td{box-shadow:inset 0 0 0 1.5px var(--ac)}
.cg button.on{background:var(--ac);color:var(--acx)}
.cg button.hs::after{content:"";position:absolute;left:50%;bottom:4px;width:4px;height:4px;margin-left:-2px;border-radius:50%;background:var(--ac)}
.cg button.on.hs::after{background:var(--acx)}
.hh{display:flex;justify-content:space-between;align-items:baseline;gap:8px}
.hh em{font-style:normal;font-size:13px;font-weight:600;color:var(--ac);border:1px solid var(--ac);border-radius:99px;padding:1px 9px;white-space:nowrap}
#list>:first-child{margin-top:0}
.gp{display:flex;align-items:center;margin-bottom:8px}
.gl{flex:0 0 78px;display:flex;flex-direction:column;align-items:center}
.gl i{width:9px;height:9px;border-radius:50%;background:var(--ac);flex:none}
.gl u{width:2px;background:var(--ac);flex:none}
.gt{padding-left:12px;font-size:13px;color:var(--mut)}
.gt b{font-size:15px;font-weight:800;color:var(--tx)}
.tl{position:relative;padding-left:18px}
.rail{position:absolute;left:0;top:0;bottom:0;width:4px;border-radius:2px;background:var(--bd)}
.fill{position:absolute;left:0;top:0;width:100%;height:0;border-radius:2px;background:var(--ac);transition:height .7s cubic-bezier(.2,.8,.2,1)}
.fill.live::after{content:"";position:absolute;left:50%;bottom:-6px;width:12px;height:12px;margin-left:-6px;border-radius:50%;background:var(--ac);box-shadow:0 0 0 3px var(--bg)}
@media (prefers-reduced-motion:reduce){.fill{transition:none}}
</style>
</head>

<p class="sub" id="sub"></p>

</div>
<div id="list"></div>
<div class="leg"><span><i style="background:var(--wyk)"></i>Wykład</span><span><i style="background:var(--lab)"></i>Laboratorium</span><span><i style="background:var(--cw)"></i>Ćwiczenia</span></div>

</main>

[2,"11:30","13:00","Wprowadzenie do informatyki technicznej","w","Aula WZ/WMiIT","dr hab. A. Kiersztyn","A"],
[2,"13:15","14:45","Zielone technologie w IT","w","Ox 15","dr inż. J. Szulżyk-Cieplak","A"],
[2,"13:15","14:45","Bezpieczeństwo i higiena pracy","w","Ox 15","mgr inż. A. Prus","B"],
[4,"15:50","18:15","Matematyka I","c","s. M402, WM","mgr inż. M. Wieczorek"],
[4,"18:30","20:00","Technologie informacyjne","l","Ox 28","mgr inż. K. Mróz"]
];
const START=new Date(2026,9,5);
const DW=["Poniedziałek","Wtorek","Środa","Czwartek","Piątek","Sobota","Niedziela"];
const mn=t=>{const a=t.split(":");return +a[0]*60+ +a[1]};
const day0=d=>new Date(d.getFullYear(),d.getMonth(),d.getDate());
const wd=d=>(d.getDay()+6)%7;
const same=(a,b)=>a.getFullYear()===b.getFullYear()&&a.getMonth()===b.getMonth()&&a.getDate()===b.getDate();
const pre=d=>day0(d)<START;
function wk(d){const m=day0(d);m.setDate(m.getDate()-wd(m));const n=Math.round((m-START)/6048e5);return n<0?"B":(n%2?"A":"B")}
let now=new Date(),sel=day0(now),mo=new Date(now.getFullYear(),now.getMonth(),1),vw="day",calOpen=false,lastFill={};
function card(x,cls,badge){
  const[d,s,e,n,t,r,p,w]=x;
  return `<div class="c ${K[t]} ${cls}" data-s="${mn(s)}" data-e="${mn(e)}"><div class="tm"><b>${s}</b><span>${e}</span></div><div class="bd"><div class="nm">${n}</div><div class="mt">${T[t]?`<span class="ty">${T[t]}</span>`:""}<span>${r}</span>${p?`<span>${p}</span>`:""}${typeof d==="string"?'<span class="ev">jednorazowo</span>':(w?'<span class="ev">co 2 tyg.</span>':"")}</div></div>${badge}</div>`;
}
const O=[["2026-10-23","11:30","13:00","Przysposobienie biblioteczne","x","s. 11, WM",""]];
const dk=d=>d.getFullYear()+"-"+String(d.getMonth()+1).padStart(2,"0")+"-"+String(d.getDate()).padStart(2,"0");
const items=d=>S.filter(x=>x[0]===wd(d)&&(!x[7]||x[7]===wk(d))).concat(O.filter(x=>x[0]===dk(d))).sort((a,b)=>mn(a[1])-mn(b[1]));
const fmt=m=>{const h=Math.floor(m/60),r=m%60;return h?(r?h+" h "+r+" min":h+" h"):r+" min"};
function gap(a,b){
  const g=mn(b[1])-mn(a[2]);
  if(g<=20)return "";
  const h=Math.min(120,Math.max(34,g*.6));
  return `<div class="gp"><div class="gl"><i></i><u style="height:${h}px"></u><i></i></div><div class="gt">Okienko <b>${fmt(g)}</b><br>${a[2]}–${b[1]}</div></div>`;
}
function dayHtml(d,live){
  const it=items(d);
  if(!it.length)return `<div class="free">Brak zajęć</div>`;
  const nm=now.getHours()*60+now.getMinutes();
  const nx=live?it.findIndex(x=>mn(x[1])>nm):-1;
  const td=day0(new Date()),st=same(d,td)?"t":(d<td?"p":"f");
  return `<div class="tl" data-k="${d.getFullYear()}-${d.getMonth()}-${d.getDate()}" data-st="${st}"><div class="rail" aria-hidden="true"><i class="fill"></i></div><div class="tlc">`+it.map((x,i)=>{
    let cls="",b="";
    if(live){
      if(nm>=mn(x[1])&&nm<mn(x[2])){cls="now";b='<span class="st">Teraz</span>'}
      else if(nm>=mn(x[2]))cls="past";
      else if(i===nx)b='<span class="st nx">Następne</span>';
    }
    return (i?gap(it[i-1],x):"")+card(x,cls,b);
  }).join("")+"</div></div>";
}
function render(){
  now=new Date();
  const td=day0(now),live=d=>same(d,td)&&!pre(d);
  document.getElementById("sub").textContent=now.toLocaleDateString("pl-PL",{weekday:"long",day:"numeric",month:"long"});
  const y=mo.getFullYear(),m=mo.getMonth();
  const hdr=["Pn","Wt","Śr","Cz","Pt","So","Nd"].map(s=>`<span class="hd">${s}</span>`).join("");
  const wkStart=d=>{const x=day0(d);x.setDate(x.getDate()-wd(x));return x};
  const row=(rs,om)=>{let rh=`<span class="wl">${pre(rs)?"":wk(rs)}</span>`;
    for(let c=0;c<7;c++){
      const d=new Date(rs.getFullYear(),rs.getMonth(),rs.getDate()+c);
      const cl=[om&&d.getMonth()!==om-1?"out":"",c>4?"we":"",same(d,td)?"td":"",same(d,sel)?"on":"",!pre(d)&&items(d).length?"hs":""].join(" ");
      rh+=`<button class="${cl}" data-a="s:${d.getFullYear()},${d.getMonth()},${d.getDate()}" aria-label="${d.toLocaleDateString("pl-PL",{weekday:"long",day:"numeric",month:"long"})}">${d.getDate()}</button>`;
    }
    return rh;
  };
  let h;
  if(calOpen){
    const start=wkStart(new Date(y,m,1));
    h=`<div class="ch"><button data-a="m:-1" aria-label="Poprzedni miesiąc">‹</button><b>${mo.toLocaleDateString("pl-PL",{month:"long",year:"numeric"})}</b><button data-a="m:1" aria-label="Następny miesiąc">›</button></div><div class="cg"><span class="hd"></span>${hdr}`;
    for(let r=0;r<6;r++){
      const rs=new Date(start.getFullYear(),start.getMonth(),start.getDate()+r*7);
      if(r>0&&rs.getMonth()!==m)break;
      h+=row(rs,m+1);
    }
    h+="</div>";
  }else{
    const rs=wkStart(sel),re=new Date(rs.getFullYear(),rs.getMonth(),rs.getDate()+6);
    h=`<div class="ch"><button data-a="wk:-1" aria-label="Poprzedni tydzień">‹</button><b>${rs.toLocaleDateString("pl-PL",{day:"numeric",month:"long"})} – ${re.toLocaleDateString("pl-PL",{day:"numeric",month:"long"})}</b><button data-a="wk:1" aria-label="Następny tydzień">›</button></div><div class="cg"><span class="hd"></span>${hdr}${row(rs,0)}</div>`;
  }
  h+=`<button class="cx" data-a="cal:" aria-label="${calOpen?"Zwiń":"Rozwiń"} kalendarz">${calOpen?"⌃":"⌄"}</button>`;
  document.getElementById("cal").innerHTML=h;
  document.getElementById("vw").innerHTML=[["day","Dzień"],["week","Cały tydzień"]].map(v=>`<button class="${vw===v[0]?"on":""}" data-a="v:${v[0]}">${v[1]}</button>`).join("");
  const dl=d=>d.toLocaleDateString("pl-PL",{day:"numeric",month:"long"});
  const note=pre(sel)?`<p class="sub" style="text-transform:none">Przed 5 października pokazuję podgląd planu z tygodnia ${wk(sel)}.</p>`:"";
  const head=(d,w)=>`<h2 class="hh"><span>${DW[wd(d)]}, ${dl(d)}</span>${w?`<em>Tydzień ${wk(d)}</em>`:""}</h2>`;
  let L;
  if(vw==="day")L=note+head(sel,1)+dayHtml(sel,live(sel));
  else{
    const mon=new Date(sel.getFullYear(),sel.getMonth(),sel.getDate()-wd(sel));
    L=note+`<h2 class="hh"><span>Tydzień ${wk(sel)}</span></h2>`+[0,1,2,3,4].map(i=>{const d=new Date(mon.getFullYear(),mon.getMonth(),mon.getDate()+i);return head(d,0)+dayHtml(d,live(d))}).join("");
  }
  document.getElementById("list").innerHTML=L;
  updateProgress();
}
document.addEventListener("click",e=>{
  const b=e.target.closest("[data-a]");if(!b)return;
  const[k,v]=b.dataset.a.split(":");
  if(k!=="cal")lastFill={};
  if(k==="s"){const p=v.split(",").map(Number);sel=new Date(p[0],p[1],p[2]);if(sel.getMonth()!==mo.getMonth())mo=new Date(p[0],p[1],1)}
  else if(k==="m")mo=new Date(mo.getFullYear(),mo.getMonth()+ +v,1);
  else if(k==="wk"){shiftWeek(+v);return}
  else if(k==="cal"){toggleCal();return}
  else if(k==="v")vw=v;
  else if(k==="today"){sel=day0(new Date());mo=new Date(sel.getFullYear(),sel.getMonth(),1)}
  render();
});
function toggleCal(){
  const c=document.getElementById("cal"),h0=c.getBoundingClientRect().height;
  calOpen=!calOpen;
  render();
  if(!c.animate||matchMedia("(prefers-reduced-motion: reduce)").matches)return;
  const h1=c.getBoundingClientRect().height;
  c.style.overflow="hidden";
  const a=c.animate([{height:h0+"px"},{height:h1+"px"}],{duration:320,easing:"cubic-bezier(.2,.8,.2,1)"});
  a.onfinish=a.oncancel=()=>{c.style.overflow=""};
  [...c.children].forEach(el=>el.animate([{opacity:0},{opacity:1}],{duration:240,delay:60,easing:"ease-out",fill:"backwards"}));
}
function updateProgress(){
  const d=new Date(),nm=d.getHours()*60+d.getMinutes()+d.getSeconds()/60;
  document.querySelectorAll("#list .tl").forEach(tl=>{
    const f=tl.querySelector(".fill"),cs=[...tl.querySelectorAll(".c")];
    if(!f||!cs.length)return;
    const a=[];
    cs.forEach(c=>{a.push([+c.dataset.s,c.offsetTop],[+c.dataset.e,c.offsetTop+c.offsetHeight])});
    const end=a[a.length-1][1],st=tl.dataset.st,k=tl.dataset.k;
    let y=st==="p"?end:0,live=false;
    if(st==="t"){
      if(nm>=a[a.length-1][0])y=end;
      else if(nm>a[0][0]){
        for(let i=1;i<a.length;i++)if(nm<=a[i][0]){
          const p=a[i-1],q=a[i];
          y=p[1]+(q[1]-p[1])*(q[0]===p[0]?1:(nm-p[0])/(q[0]-p[0]));
          break;
        }
        live=true;
      }
    }
    if(!f.dataset.i){
      f.dataset.i="1";
      f.style.transition="none";
      f.style.height=Math.min(lastFill[k]||0,end)+"px";
      void f.offsetHeight;
      f.style.transition="";
    }
    f.style.height=y+"px";
    lastFill[k]=y;
    f.classList.toggle("live",live);
  });
}
function shiftWeek(n){
  lastFill={};
  const mon=new Date(sel.getFullYear(),sel.getMonth(),sel.getDate()+7*n-wd(sel));
  const t=day0(new Date()),tMon=new Date(t.getFullYear(),t.getMonth(),t.getDate()-wd(t));
  sel=same(mon,tMon)?t:mon;
  mo=new Date(sel.getFullYear(),sel.getMonth(),1);
  render();
  const g=document.querySelector("#cal .cg");
  if(g&&g.animate&&!matchMedia("(prefers-reduced-motion: reduce)").matches)
    g.animate([{transform:`translateX(${n*36}px)`,opacity:.25},{transform:"none",opacity:1}],{duration:200,easing:"ease-out"});
}
(function(){
  const c=document.getElementById("cal");let x0=0,y0=0,on=false;
  c.addEventListener("touchstart",e=>{
    if(calOpen||e.touches.length!==1){on=false;return}
    x0=e.touches[0].clientX;y0=e.touches[0].clientY;on=true;
  },{passive:true});
  c.addEventListener("touchend",e=>{
    if(!on||calOpen)return;on=false;
    const t=e.changedTouches[0],dx=t.clientX-x0,dy=t.clientY-y0;
    if(Math.abs(dx)>45&&Math.abs(dx)>1.5*Math.abs(dy))shiftWeek(dx<0?1:-1);
  },{passive:true});
  c.addEventListener("touchcancel",()=>{on=false},{passive:true});
})();
render();
if(window.ResizeObserver)new ResizeObserver(updateProgress).observe(document.getElementById("list"));
addEventListener("resize",updateProgress);
if(document.fonts&&document.fonts.ready)document.fonts.ready.then(updateProgress);
let seen=day0(new Date());
function fresh(){const t=day0(new Date());if(!same(t,seen)){seen=t;sel=t;mo=new Date(t.getFullYear(),t.getMonth(),1)}render()}
setInterval(fresh,60000);
document.addEventListener("visibilitychange",()=>{if(!document.hidden)fresh()});
addEventListener("pageshow",fresh);
</script>
</body>
</html>
